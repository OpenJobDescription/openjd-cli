specificationVersion: environment-2023-09
extensions:
  - EXPR
  - WRAP_ACTIONS
environment:
  name: WrapEchoesStepName
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["-c", "print('WrapEnvEnter')"]
      onWrapTaskRun:
        command: python
        args: ["-c", "print('WrappedStepName={{ WrappedStep.Name }}')"]
      onWrapEnvExit:
        command: python
        args: ["-c", "print('WrapEnvExit')"]
