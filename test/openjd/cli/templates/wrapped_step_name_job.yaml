specificationVersion: "jobtemplate-2023-09"
name: WrappedStepNameJob
description: A single step whose onRun is replaced by an active onWrapTaskRun hook

steps:
  - name: WrappedTaskStep
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TaskRanUnwrapped')"]
