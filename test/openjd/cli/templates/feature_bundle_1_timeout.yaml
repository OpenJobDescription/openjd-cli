specificationVersion: jobtemplate-2023-09
name: FB1 Format String Timeout
extensions:
  - FEATURE_BUNDLE_1
parameterDefinitions:
  - name: Timeout
    type: INT
    # Generous relative to the ~1s the action needs: the point of the test is
    # that the format string resolves into `timeout`, not that the timeout
    # fires. A tight value made the action race its own budget under a loaded
    # parallel test run and exit non-zero.
    default: 20
steps:
  - name: TimeoutStep
    script:
      actions:
        onRun:
          command: bash
          args: ["-c", "echo Running with timeout {{Param.Timeout}}s; sleep 1"]
          timeout: "{{Param.Timeout}}"
