specificationVersion: "jobtemplate-2023-09"
extensions:
  - EXPR
name: JobNameExprJob

steps:
  - name: EchoJobName
    let:
      - bound_job_name = Job.Name
    stepEnvironments:
      - name: JobNameEcho
        script:
          actions:
            onEnter:
              command: python
              args: ["-c", "print('EnvSawJobName={{ bound_job_name }}')"]
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TaskRan')"]
