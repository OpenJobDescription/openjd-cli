specificationVersion: "jobtemplate-2023-09"
name: Redacted Env Undeclared
description: Emits openjd_redacted_env without declaring the REDACTED_ENV_VARS extension

jobEnvironments:
  - name: EmitRedactedEnv
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print('openjd_redacted_env: SECRET=s3cret')"]
steps:
  - name: ShowSecret
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os; print('SECRET_IS=' + str(os.environ.get('SECRET')))"]
